<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica Pro</title>
    <style>
        :root {
            --poki-bg: #2a205d; --poki-dark: #1e1547; --accent: #6c5ce7;
            --calc-bg: #2c3e50; --btn-num: #34495e; --btn-op: #f39c12; --btn-c: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

        /* --- CALCULADORA --- */
        #calc-view { width: 340px; background: #2c3e50; padding: 25px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .top-row { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; color: white; font-size: 14px; }
        
        #display { 
            width: 100%; height: 80px; background: #bdc3c7; color: #2c3e50; 
            text-align: right; font-size: 45px; border: 5px solid #7f8c8d; border-radius: 10px; 
            margin-bottom: 20px; padding: 10px; outline: none; letter-spacing: 2px;
        }

        .grid-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { 
            height: 65px; border: none; border-radius: 10px; font-size: 22px; font-weight: bold;
            color: white; cursor: pointer; background: var(--btn-num); transition: 0.1s;
        }
        button:active { transform: scale(0.95); filter: brightness(1.2); }
        .op { background: var(--btn-op); }
        .btn-c { background: var(--btn-c); }
        .btn-eq { background: #e67e22; grid-row: span 2; height: 142px; }

        /* --- PORTAL --- */
        #portal { display: none; position: fixed; inset: 0; background: var(--poki-bg); z-index: 1000; flex-direction: column; overflow-y: auto; }
        header { background: var(--poki-dark); padding: 15px 40px; border-bottom: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1100; }
        .game-grid { display: grid; padding: 25px; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-width: 1400px; margin: 0 auto; width: 100%; }
        .card { background: #1a123d; border-radius: 18px; overflow: hidden; cursor: pointer; transition: 0.2s; border-bottom: 5px solid rgba(0,0,0,0.4); text-align: center; }
        .card:hover { transform: scale(1.05); background: var(--accent); }
        .card-img { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
        .card-img svg { width: 45%; height: 45%; fill: white; }
        .card p { padding: 10px; font-size: 11px; color: white; font-weight: 800; text-transform: uppercase; white-space: nowrap; }

        /* --- PLAYER --- */
        #theater { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; grid-template-columns: 200px 1fr 200px; }
        .side { background: #0a0a0a; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .mini-card { width: 100%; aspect-ratio: 1; border-radius: 12px; cursor: pointer; background: #1a123d; display: flex; align-items: center; justify-content: center; }
        .mini-card svg { width: 40%; height: 40%; fill: white; opacity: 0.4; }
        .main-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; padding: 20px;}
        iframe { width: 100%; height: 90vh; border-radius: 16px; border: none; background: #111; box-shadow: 0 0 40px rgba(108, 92, 231, 0.3); }
        .exit-btn { position: absolute; top: 10px; right: 20px; background: #ff3b30; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 2100; }
    </style>
</head>
<body>

    <div id="calc-view">
        <div class="top-row">
            <span>Code Mode</span>
            <input type="checkbox" id="mode" style="margin-left:10px; transform: scale(1.2);" checked>
        </div>
        <input type="text" id="display" readonly value="0">
        <div class="grid-btns">
            <button class="btn-c" onclick="c()">C</button>
            <button class="op" onclick="n('/')">√</button><button class="op" onclick="n('/')">÷</button><button class="op" onclick="n('*')">×</button>
            <button onclick="n('7')">7</button><button onclick="n('8')">8</button><button onclick="n('9')">9</button><button class="op" onclick="n('-')">-</button>
            <button onclick="n('4')">4</button><button onclick="n('5')">5</button><button onclick="n('6')">6</button><button class="op" onclick="n('+')">+</button>
            <button onclick="n('1')">1</button><button onclick="n('2')">2</button><button onclick="n('3')">3</button>
            <button class="btn-eq" onclick="check()">=</button>
            <button onclick="n('0')" style="grid-column: span 2; border-radius: 10px;">0</button><button onclick="n('.')">.</button>
        </div>
    </div>

    <div id="portal">
        <header>
            <h1 style="color:white; font-size: 22px;">Science<span style="color:var(--accent)">trick</span> PRO</h1>
            <div style="color: #30d158; font-size: 11px; font-weight: bold; letter-spacing: 1px;">SISTEMA ESTABLE</div>
        </header>
        <div class="game-grid" id="main-grid"></div>
    </div>

    <div id="theater">
        <button class="exit-btn" onclick="closeGame()">VOLVER</button>
        <div class="side" id="l-side"></div>
        <div class="main-stage">
            <h2 id="g-name" style="color:white; margin-bottom:10px; font-weight: 300; letter-spacing: 1px;"></h2>
            <iframe id="ifr" src="" allowfullscreen></iframe>
        </div>
        <div class="side" id="r-side"></div>
    </div>

    <script>
        let input = "";
        
        const SVGS = {
            play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
            game: '<svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5z"/></svg>',
            bolt: '<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>'
        };

        // Enlaces 100% compatibles con iframes basados en repositorios de GitHub y webGL abiertos
        const games = [
            {n:"Subway Surfers", u:"https://macvg.github.io/subway-surfers/", c:"#ff9f0a", i:SVGS.play},
            {n:"Slope", u:"https://macvg.github.io/slope/", c:"#5856d6", i:SVGS.bolt},
            {n:"Retro Bowl", u:"https://macvg.github.io/retro-bowl/", c:"#ff2d55", i:SVGS.play},
            {n:"Moto X3M", u:"https://macvg.github.io/moto-x3m/", c:"#ff3b30", i:SVGS.bolt},
            {n:"Geometry Dash", u:"https://macvg.github.io/geometry-dash/", c:"#ffcc00", i:SVGS.play},
            {n:"Run 3", u:"https://macvg.github.io/run-3/", c:"#007aff", i:SVGS.bolt},
            {n:"Tunnel Rush", u:"https://macvg.github.io/tunnel-rush/", c:"#af52de", i:SVGS.bolt},
            {n:"Drive Mad", u:"https://macvg.github.io/drive-mad/", c:"#30d158", i:SVGS.game},
            {n:"Monkey Mart", u:"https://macvg.github.io/monkey-mart/", c:"#30d158", i:SVGS.game},
            {n:"Smash Karts", u:"https://macvg.github.io/smash-karts/", c:"#007aff", i:SVGS.game},
            {n:"Cookie Clicker", u:"https://macvg.github.io/cookie-clicker/", c:"#ffcc00", i:SVGS.play},
            {n:"BitLife", u:"https://macvg.github.io/bitlife/", c:"#5856d6", i:SVGS.game}
        ];

        // LÓGICA DE LA CALCULADORA (ARREGLADA)
        function n(v) { 
            input += v; 
            document.getElementById('display').value = input; 
            if(input === "0000") unlock(); 
        }
        
        function c() { 
            input = ""; 
            document.getElementById('display').value = "0"; 
        }
        
        function check() { 
            if(input === "0000") unlock(); 
            else {
                // Simular cálculo rápido para despistar
                document.getElementById('display').value = "Error";
                setTimeout(c, 1000);
            }
        }

        // APERTURA DEL PORTAL
        function unlock() {
            document.getElementById('calc-view').style.display = 'none';
            document.getElementById('portal').style.display = 'flex';
            document.body.style.background = "#2a205d";
            
            const g = document.getElementById('main-grid');
            g.innerHTML = ""; 
            
            games.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-img" style="background:linear-gradient(45deg, ${item.c}, #000)">${item.i}</div><p>${item.n}</p>`;
                card.onclick = () => play(item.u, item.n);
                g.appendChild(card);
            });
        }

        // CARGA DEL JUEGO
        function play(u, n) {
            document.getElementById('theater').style.display = 'grid';
            document.getElementById('ifr').src = u;
            document.getElementById('g-name').innerText = n;
            
            const l = document.getElementById('l-side'); 
            const r = document.getElementById('r-side');
            l.innerHTML = r.innerHTML = "";
            
            const shuffled = [...games].sort(() => 0.5 - Math.random());
            for(let i=0; i<8; i++) {
                if(!shuffled[i]) break;
                let div = document.createElement('div');
                div.className = 'mini-card';
                div.innerHTML = shuffled[i].i;
                div.onclick = () => play(shuffled[i].u, shuffled[i].n);
                (i < 4 ? l : r).appendChild(div);
            }
        }

        // CERRAR JUEGO (Vacía el iframe para que no de lag)
        function closeGame() {
            document.getElementById('theater').style.display = 'none';
            document.getElementById('ifr').src = ""; 
        }
    </script>
</body>
</html>
